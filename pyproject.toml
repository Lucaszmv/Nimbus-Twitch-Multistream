[tool.poetry]
name = "nimbus"
version = "1.0.0"
description = "Ferramenta para transmitir múltiplos streams para Twitch simultaneamente"
license = "MIT"
readme = "README.md"
packages = [
    { include = "modules" }
]

[tool.poetry.dependencies]
python = "^3.8"
colorama = "^0.4.6"
questionary = "^2.0.1"
# tkinter é parte da biblioteca padrão do Python

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
nimbus = "main:main"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 100
extend-ignore = "E203"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "logs"
]